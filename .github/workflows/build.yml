name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NovelaMaker.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - name: Leer version
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' proj/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Ren
