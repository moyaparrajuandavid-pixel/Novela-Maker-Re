name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NovelaMaker.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - name: Preparar APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' proj/app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          cp proj/app/build/outputs/apk/debug/app-debug.apk "NovelaMaker-$V.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Novela Maker ${{ env.VERSION }}
          body_path: proj/RELEASE_NOTES.md
          files: NovelaMaker-${{ env.VERSION }}.apk
